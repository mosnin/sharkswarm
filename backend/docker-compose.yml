version: "3.9"

services:
  # ── Infrastructure ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nanoclaw-net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nanoclaw}
      POSTGRES_USER: ${POSTGRES_USER:-nanoclaw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nanoclaw}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nanoclaw-net

  # ── OpenAI Agents ────────────────────────────────────────────────
  nanoclaw-agent-1:
    build:
      context: ./agent-runtime
      dockerfile: Dockerfile
    image: sharkswarm-agent
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      AGENT_ID: agent-1
      AGENT_NAME: "Agent Alpha"
      SYSTEM_PROMPT: "You are Agent Alpha, a general-purpose assistant in the SharkSwarm multi-agent system. Be concise and helpful."
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-nanoclaw}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-nanoclaw}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - nanoclaw-net

  nanoclaw-agent-2:
    build:
      context: ./agent-runtime
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      AGENT_ID: agent-2
      AGENT_NAME: "Agent Beta"
      SYSTEM_PROMPT: "You are Agent Beta, a specialist assistant in the SharkSwarm multi-agent system. Focus on detailed analysis and structured responses."
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-nanoclaw}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-nanoclaw}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - nanoclaw-net

  # ── Redis ↔ Postgres Bridge ────────────────────────────────────
  redis-bridge:
    build: ./redis-pubsub
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-nanoclaw}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-nanoclaw}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - nanoclaw-net

  # ── Cron Scheduler ────────────────────────────────────────────────
  scheduler:
    build: ./scheduler
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-nanoclaw}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-nanoclaw}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - nanoclaw-net

  # ── API Gateway (public-facing, called by Vercel frontend) ─────
  api:
    build: ./api
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      API_PORT: "4000"
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-nanoclaw}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-nanoclaw}
      DOCKER_NETWORK: backend_nanoclaw-net
      AGENT_IMAGE: sharkswarm-agent
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - nanoclaw-net

  # ── Frontend (optional — for local dev or self-hosted) ─────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - api
    networks:
      - nanoclaw-net

networks:
  nanoclaw-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
