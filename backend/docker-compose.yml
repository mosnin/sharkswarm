services:
  # ── Infrastructure ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nanoclaw-net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nanoclaw}
      POSTGRES_USER: ${POSTGRES_USER:-nanoclaw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nanoclaw}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nanoclaw-net

  # ── OpenClaw Agents ─────────────────────────────────────────────
  openclaw-agent-1:
    build:
      context: ./nanoclaw
      dockerfile: Dockerfile
    image: sharkswarm-openclaw
    restart: unless-stopped
    volumes:
      - ./agent1/config:/home/node/.openclaw
      - ./agent1/workspace:/home/node/.openclaw/workspace
    environment:
      HOME: /home/node
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENCLAW_GATEWAY_BIND: lan
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-nanoclaw}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-nanoclaw}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - nanoclaw-net

  openclaw-agent-2:
    build:
      context: ./nanoclaw
      dockerfile: Dockerfile
    image: sharkswarm-openclaw
    restart: unless-stopped
    volumes:
      - ./agent2/config:/home/node/.openclaw
      - ./agent2/workspace:/home/node/.openclaw/workspace
    environment:
      HOME: /home/node
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENCLAW_GATEWAY_BIND: lan
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-nanoclaw}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-nanoclaw}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - nanoclaw-net

  # ── Redis ↔ Postgres Bridge ────────────────────────────────────
  redis-bridge:
    build: ./redis-pubsub
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-nanoclaw}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-nanoclaw}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - nanoclaw-net

  # ── Cron Scheduler ────────────────────────────────────────────────
  scheduler:
    build: ./scheduler
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-nanoclaw}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-nanoclaw}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - nanoclaw-net

  # ── API Gateway (public-facing, called by Vercel frontend) ─────
  api:
    build: ./api
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      API_PORT: "4000"
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-nanoclaw}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-nanoclaw}
      DOCKER_NETWORK: backend_nanoclaw-net
      AGENT_IMAGE: sharkswarm-openclaw
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - nanoclaw-net

  # ── Cloudflare Tunnel (exposes API at api.agentfrac.com) ──────
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run sharkswarm
    volumes:
      - ${HOME}/.cloudflared:/etc/cloudflared:ro
    depends_on:
      - api
    networks:
      - nanoclaw-net

  # ── Frontend (optional — for local dev or self-hosted) ─────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: https://api.agentfrac.com
    depends_on:
      - api
    networks:
      - nanoclaw-net

networks:
  nanoclaw-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
