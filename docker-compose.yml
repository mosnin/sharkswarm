version: "3.9"

services:
  # ── Infrastructure ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: openclaw-redis
    ports:
      - "6379:6379"
    networks:
      - openclaw-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: openclaw-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openclaw}
      POSTGRES_USER: ${POSTGRES_USER:-openclaw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    networks:
      - openclaw-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openclaw}"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── OpenClaw Agents ─────────────────────────────────────────────
  openclaw-agent-1:
    image: alpine/openclaw:latest
    container_name: openclaw-agent-1
    ports:
      - "3000:18789"
    volumes:
      - ./openclaw/agent1:/home/node/.openclaw
    environment:
      OPENCLAW_CUSTOM_CONFIG: /home/node/.openclaw/openclaw.json
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-openclaw}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-openclaw}
    networks:
      - openclaw-net
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  openclaw-agent-2:
    image: alpine/openclaw:latest
    container_name: openclaw-agent-2
    ports:
      - "3001:18789"
    volumes:
      - ./openclaw/agent2:/home/node/.openclaw
    environment:
      OPENCLAW_CUSTOM_CONFIG: /home/node/.openclaw/openclaw.json
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-openclaw}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-openclaw}
    networks:
      - openclaw-net
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend Dashboard ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: openclaw-frontend
    ports:
      - "3002:3000"
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-openclaw}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-openclaw}
      AGENT_1_URL: http://openclaw-agent-1:18789
      AGENT_2_URL: http://openclaw-agent-2:18789
    networks:
      - openclaw-net
    depends_on:
      - openclaw-agent-1
      - openclaw-agent-2
      - postgres
    restart: unless-stopped

networks:
  openclaw-net:
    driver: bridge

volumes:
  pgdata:
